spring.application.name=DriveEase
server.port=${PORT:8080}

# Local MongoDB by default. Override with MONGODB_URI for MongoDB Atlas.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/driveease}
spring.data.mongodb.auto-index-creation=true

